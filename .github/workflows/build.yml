# .github/workflows/build.yml
#
# This is the one workflow every pull request to main runs, whatever it
# changes; it installs once, builds, lints, type-checks the test tree, runs
# the suite once and packages a test VSIX that a sticky comment on the pull
# request links. Fork pull requests get a read-only token, so only the
# comment step is skipped for them.
name: Build

on:
  pull_request:
    branches:
      - main

# A newer push cancels the superseded run of the same pull request.
concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: BBj CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Write access is only for the sticky comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: ./.github/actions/node-setup

      - name: Build
        id: build
        working-directory: bbj-vscode
        run: npm run build

      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: bbj-vscode
        run: npm run lint

      - name: Type-check test tree
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: bbj-vscode
        run: npm run typecheck:test

      - name: Test
        if: success() || failure()
        working-directory: bbj-vscode
        run: npm run test

      - name: Package VSIX
        id: pkg
        working-directory: bbj-vscode
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse --short HEAD)
          OUT="${NAME}-${VERSION}-pr${{ github.event.pull_request.number }}-${SHA}.vsix"
          npx vsce package --out "$OUT"
          echo "vsix=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-pr${{ github.event.pull_request.number }}
          path: bbj-vscode/${{ steps.pkg.outputs.vsix }}
          retention-days: 14
          if-no-files-found: error

      - name: Comment on PR with install instructions
        # Fork PRs get a read-only token and cannot comment; skip them (artifact still builds).
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const vsix = ${{ toJSON(steps.pkg.outputs.vsix) }};
            const sha = ${{ toJSON(steps.pkg.outputs.sha) }};
            const artifactUrl = ${{ toJSON(steps.upload.outputs.artifact-url) }};
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- pr-vsix -->';
            const body = [
              marker,
              `### 📦 Test build ready — \`${vsix}\``,
              '',
              `Built from \`${sha}\`. Install it to try this PR without touching your Marketplace/preview build:`,
              '',
              `1. Download the **[VSIX artifact](${artifactUrl})** (a zip) and unzip it.`,
              `2. \`code --install-extension ${vsix}\` — or Command Palette → **Extensions: Install from VSIX…**`,
              `3. Reload. To revert, uninstall it and reinstall the preview build.`,
              '',
              `<sub>Artifact expires in 14 days · <a href="${runUrl}">workflow run</a></sub>`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
