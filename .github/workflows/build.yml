name: Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: BBj CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Build
      id: build
      shell: bash
      run: |
        cd bbj-vscode
        npm ci
        npm run build
    - name: Lint
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: |
        cd bbj-vscode
        npm run lint
    - name: Type-check test tree
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: |
        cd bbj-vscode
        npm run typecheck:test
    - name: Test
      if: success() || failure()
      shell: bash
      run: |
        cd bbj-vscode
        npm run test
    - name: Bundle Extension
      shell: bash
      run: |
        cd bbj-vscode
        npx vsce package
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4 
      with: 
        name: vscode-extension
        path: |
          ./bbj-vscode/*.vsix
