# .github/workflows/preview.yml
name: Publish Preview Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The version bump is computed early in `verify` but now commits only after
# publication in `bump-version`, so two overlapping pushes to main could
# otherwise compute the same preview version and collide at `vsce publish`.
# Serialising preview runs closes that window.
concurrency:
  group: publish-preview
  cancel-in-progress: false

# Only jobs that push a commit or create a release escalate their own scope;
# everything else reads.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: ./.github/actions/node-setup

      - name: Install CLI Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          # vsce comes from bbj-vscode devDependencies (npm ci) — `npx vsce` resolves the pinned version

      - name: Bump patch version
        id: bump
        working-directory: bbj-vscode
        run: |
          VERSION=$(jq -r .version package.json)
          PARTS=(${VERSION//./ })

          if [ ${#PARTS[@]} -eq 2 ]; then
            NEW_VERSION="${PARTS[0]}.${PARTS[1]}.1"
          else
            PATCH=${PARTS[2]:-0}
            PATCH=$((PATCH + 1))
            NEW_VERSION="${PARTS[0]}.${PARTS[1]}.$PATCH"
          fi

          echo "Bumping version to $NEW_VERSION"
          jq ".version = \"$NEW_VERSION\"" package.json > tmp && mv tmp package.json
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Build
        working-directory: bbj-vscode
        run: npm run build

      - name: Lint
        working-directory: bbj-vscode
        run: npm run lint

      - name: Type-check test tree
        working-directory: bbj-vscode
        run: npm run typecheck:test

      - name: Test
        working-directory: bbj-vscode
        run: npm run test

      - name: Package preview extension
        working-directory: bbj-vscode
        run: npx vsce package --pre-release

      - name: Upload language server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: language-server
          path: bbj-vscode/out/language/main.cjs
          retention-days: 7

      - name: Upload VS Code extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: bbj-vscode/*.vsix
          retention-days: 7

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          min-wrapper-count: 1

      # Gradle User Home is cached except the IntelliJ IDE downloads and
      # their extracted copies, which the Plugin Verifier comment below
      # measures against the 10 GB repository limit; only the default
      # branch writes the cache, pull requests read it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-home-cache-excludes: |
            caches/modules-2/files-2.1/idea
            caches/modules-2/files-2.1/com.jetbrains.intellij.*
            caches/*/transforms
            caches/transforms-*

      # Caches the IntelliJ Plugin Verifier's own plugin and dependency
      # downloads (the 210.18 MB reported by run 35064112482), which land
      # under ~/.pluginVerifier. The IDEs verifyPlugin checks against are
      # deliberately NOT cached here: Gradle resolves them into
      # ~/.gradle/caches at roughly 1 GB per tarball and 2.6-3.4 GB
      # extracted per IDE, some 4.9 GB and ~14.6 GB respectively for the
      # four recommended IDEs plus the compile platform, against this
      # repository's 10 GB per-repository cache limit. The IDE set comes
      # from `recommended()` and drifts over time, so the key hashes
      # build.gradle.kts and falls back to the OS-scoped prefix: when the
      # recommended set moves without a build-script change, the delta is
      # re-downloaded rather than re-cached — an accepted trade for a
      # bounded cache entry.
      - name: Cache Plugin Verifier downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pluginVerifier
          key: pluginverifier-${{ runner.os }}-${{ hashFiles('bbj-intellij/build.gradle.kts') }}
          restore-keys: |
            pluginverifier-${{ runner.os }}-

      - name: Build IntelliJ plugin
        working-directory: bbj-intellij
        run: ./gradlew buildPlugin -Pversion=${{ steps.bump.outputs.version }}

      # Verified at the version that is about to be published, with the same
      # failureLevel as the release workflow, so a preview build cannot ship an
      # artifact to the opt-in channel that the release gate would reject.
      - name: Verify plugin compatibility
        working-directory: bbj-intellij
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew verifyPlugin
          -Pversion=${{ steps.bump.outputs.version }}

      - name: Upload IntelliJ plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bbj-intellij-${{ steps.bump.outputs.version }}
          path: bbj-intellij/build/distributions/bbj-intellij-*.zip
          retention-days: 7

  bump-version:
    runs-on: ubuntu-latest
    needs: verify
    # It pushes the version bump commit.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Landed ahead of the publishes rather than after them: if the bump
      # commit never lands, the next preview run recomputes the same
      # version and the marketplace rejects the duplicate, so the bump is
      # the cheaper thing to land first — while still, per the gate rule,
      # sitting behind verification.
      - name: Commit version bump
        working-directory: bbj-vscode
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          jq ".version = \"$VERSION\"" package.json > tmp && mv tmp package.json
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add package.json
          git commit -m "Bump preview version"
          git push

  publish-vscode:
    runs-on: ubuntu-latest
    needs: [verify, bump-version]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job holds the Marketplace token, so it installs cold and
      # restores no cache.
      - name: Set up Node
        uses: ./.github/actions/node-setup
        with:
          cache: 'false'

      - name: Download VS Code extension
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension
          path: ./artifacts

      - name: Publish preview to VS Code Marketplace
        working-directory: bbj-vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VSIX="$(ls "$GITHUB_WORKSPACE"/artifacts/*.vsix)"
          npx vsce publish --pre-release --packagePath "$VSIX" -p "$VSCE_PAT"

  publish-intellij:
    runs-on: ubuntu-latest
    needs: [verify, bump-version]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download language server
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: language-server
          path: bbj-vscode/out/language/

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          min-wrapper-count: 1

      # This job holds the Marketplace token, so it restores no cache and
      # Gradle resolves everything cold.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Publish IntelliJ preview to JetBrains Marketplace
        working-directory: bbj-intellij
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: >-
          ./gradlew publishPlugin
          -Pversion=${{ needs.verify.outputs.version }}
          -PintellijChannel=preview
          -PintellijPlatformPublishingToken="$JETBRAINS_MARKETPLACE_TOKEN"
