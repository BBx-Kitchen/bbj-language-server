# .github/workflows/workflow-hygiene.yml
#
# Three permanent checks over the workflow tree, each a zero-dependency
# Node script run install-free: no workflow or composite-action `run:` body
# inlines a `${{ secrets.* }}` expression (secrets must be bound through a
# step-scoped `env:` mapping instead); every Gradle wrapper pins its
# distribution checksum and every job invoking Gradle validates the wrapper
# before its first Gradle call; and every `uses:` reference across the
# workflows and the composite actions is pinned to a commit SHA with a
# version comment, with least-privilege permissions on every workflow.
name: Workflow Hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-hygiene:
    name: No secrets in run bodies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: ./.github/actions/node-setup
        with:
          install: 'false'
          cache: 'false'

      - name: Scan workflow run bodies for inline secret expressions
        run: node bbj-vscode/tools/check-workflow-secrets.mjs .github/workflows .github/actions/*

  wrapper-hygiene:
    name: Gradle wrapper pinned and validated
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: ./.github/actions/node-setup
        with:
          install: 'false'
          cache: 'false'

      - name: Check the Gradle wrapper pin and workflow validation steps
        run: node bbj-vscode/tools/check-gradle-wrapper.mjs

  pin-hygiene:
    name: Actions pinned, permissions least-privilege
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: ./.github/actions/node-setup
        with:
          install: 'false'
          cache: 'false'

      - name: Check action pins and workflow permissions
        run: node bbj-vscode/tools/check-action-pins-and-permissions.mjs
