# .github/workflows/pr-validation.yml
name: PR Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'bbj-intellij/**'
      - 'bbj-vscode/src/language/**'
      - 'bbj-vscode/tools/**'
      - 'bbj-vscode/syntaxes/**'
      - '.github/workflows/pr-validation.yml'

# A newer push cancels the superseded run of the same pull request.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-vscode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: ./.github/actions/node-setup

      - name: Build
        working-directory: bbj-vscode
        run: npm run build

      - name: Upload language server
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: language-server
          path: bbj-vscode/out/language/main.cjs
          retention-days: 1

  validate-intellij:
    runs-on: ubuntu-latest
    needs: build-vscode

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download language server
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: language-server
          path: bbj-vscode/out/language/

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          min-wrapper-count: 1

      # Gradle User Home is cached except the IntelliJ IDE downloads and
      # their extracted copies, which the Plugin Verifier comment below
      # measures against the 10 GB repository limit; only the default
      # branch writes the cache, pull requests read it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-home-cache-excludes: |
            caches/modules-2/files-2.1/idea
            caches/modules-2/files-2.1/com.jetbrains.intellij.*
            caches/*/transforms
            caches/transforms-*

      # Caches the IntelliJ Plugin Verifier's own plugin and dependency
      # downloads (the 210.18 MB reported by run 35064112482), which land
      # under ~/.pluginVerifier. The IDEs verifyPlugin checks against are
      # deliberately NOT cached here: Gradle resolves them into
      # ~/.gradle/caches at roughly 1 GB per tarball and 2.6-3.4 GB
      # extracted per IDE, some 4.9 GB and ~14.6 GB respectively for the
      # four recommended IDEs plus the compile platform, against this
      # repository's 10 GB per-repository cache limit. The IDE set comes
      # from `recommended()` and drifts over time, so the key hashes
      # build.gradle.kts and falls back to the OS-scoped prefix: when the
      # recommended set moves without a build-script change, the delta is
      # re-downloaded rather than re-cached — an accepted trade for a
      # bounded cache entry.
      - name: Cache Plugin Verifier downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pluginVerifier
          key: pluginverifier-${{ runner.os }}-${{ hashFiles('bbj-intellij/build.gradle.kts') }}
          restore-keys: |
            pluginverifier-${{ runner.os }}-

      - name: Build IntelliJ plugin
        working-directory: bbj-intellij
        run: ./gradlew buildPlugin

      # Runs the same gate as the release workflow, at the same failureLevel, so a
      # verifier problem fails the PR that introduces it instead of surfacing for the
      # first time during a Manual Release (#669 raised the IntelliJ Platform Gradle
      # Plugin to 2.18.1; 2.15.0 had widened the default failureLevel to include
      # internal and override-only API usages, which nothing outside the release
      # workflow ran).
      - name: Verify plugin compatibility
        working-directory: bbj-intellij
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew verifyPlugin
